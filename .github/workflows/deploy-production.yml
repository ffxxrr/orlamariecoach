name: Deploy to Production

# Pushing a v* tag builds the production image and pushes it to GHCR.
# apps3 isn't reachable from GitHub, so it pulls new images itself
# (deployment/autodeploy.sh on a cron) and goes live within ~5 minutes.

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/ffxxrr/orlamariecoach

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://orlamariecoach.com \
            --build-arg NEXT_PUBLIC_FEATURES_COURSES=false \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 -e SESSION_SECRET=smoke-test-secret-only ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          docker exec smoke sh -c 'ls content/blog/*.md' | grep -v _GUIDE || { echo "No blog posts in the image"; exit 1; }
          for path in / /blog /blog/feed.xml /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path $code"
            [ "$code" = 200 ] || { docker logs smoke; exit 1; }
          done

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE }}:latest
