name: Deploy to Production

# Pushing a v* tag builds the production image and pushes it to GHCR.
# apps3 isn't reachable from GitHub, so it pulls new images itself
# (deployment/autodeploy.sh on a cron) and goes live within ~5 minutes.

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/ffxxrr/orlamariecoach

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://orlamariecoach.com \
            --build-arg NEXT_PUBLIC_FEATURES_COURSES=false \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE }}:latest
